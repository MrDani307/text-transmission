<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Облачный Блокнот</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            position: relative;
            overflow: hidden;
        }

        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #7b2ff7, #4a00e0);
            top: -150px; left: -150px;
            animation: float1 8s ease-in-out infinite;
        }
        body::after {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #00c3ff, #0066ff);
            bottom: -100px; right: -100px;
            animation: float2 10s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0,0); }
            50%       { transform: translate(40px,40px); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0,0); }
            50%       { transform: translate(-30px,-30px); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            padding: 32px 28px 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 16px rgba(168,85,247,0.5);
        }
        .logo-text {
            font-size: 16px; font-weight: 600;
            color: rgba(255,255,255,0.9); letter-spacing: 0.3px;
        }
        #user-info {
            font-size: 12px; color: rgba(255,255,255,0.45);
            max-width: 170px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        #btn-logout {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,100,100,0.8);
            font-size: 18px; cursor: pointer;
            width: 34px; height: 34px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0; margin-left: 10px;
        }
        #btn-logout:hover {
            background: rgba(255,80,80,0.2);
            border-color: rgba(255,80,80,0.4); color: #ff6464;
        }

        .divider {
            height: 1px;
            background: rgba(255,255,255,0.07);
            margin: 20px 0 18px;
        }

        #anim-picker {
            display: flex; gap: 6px;
            flex-wrap: wrap; margin-bottom: 14px;
        }
        .anim-btn {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.45);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 5px 13px; border-radius: 20px;
            font-size: 12px; cursor: pointer;
            transition: all 0.2s; width: auto; margin: 0;
        }
        .anim-btn:hover {
            background: rgba(168,85,247,0.2);
            border-color: rgba(168,85,247,0.5); color: #fff;
        }
        .anim-btn.active {
            background: linear-gradient(135deg,rgba(168,85,247,0.5),rgba(99,102,241,0.5));
            border-color: rgba(168,85,247,0.7); color: #fff;
            box-shadow: 0 0 12px rgba(168,85,247,0.3);
        }

        /* ── Поле ввода ── */
        .input-wrapper {
            position: relative;
            margin-bottom: 10px;
        }

        #real-input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.001;
            resize: none; border: none; outline: none;
            background: transparent;
            color: transparent;
            caret-color: transparent;
            font-size: 14px;
            font-family: 'Segoe UI', Arial, sans-serif;
            line-height: 1.65;
            padding: 14px 16px;
            z-index: 2; cursor: text;
            overflow-y: auto;
        }

        #display-layer {
            width: 100%;
            height: 160px;
            min-height: 60px;
            max-height: 500px;
            resize: vertical;
            overflow-y: auto;
            overflow-x: hidden;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 14px;
            font-family: 'Segoe UI', Arial, sans-serif;
            line-height: 1.65;
            color: rgba(255,255,255,0.92);
            white-space: pre-wrap;
            word-break: break-word;
            text-align: left;
            transition: border-color 0.2s, box-shadow 0.2s;
            cursor: text;
            position: relative; z-index: 1;
            user-select: none;
            -webkit-user-select: none;
        }
        #display-layer.focused {
            border-color: rgba(168,85,247,0.5);
            box-shadow: 0 0 0 3px rgba(168,85,247,0.12),
                        inset 0 0 20px rgba(168,85,247,0.04);
        }
        #display-layer.empty::before {
            content: "Введите текст здесь...";
            color: rgba(255,255,255,0.2);
            pointer-events: none;
        }

        /* ── КУРСОР ── */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: #a855f7;
            vertical-align: text-bottom;
            margin-left: -1px;
            animation: blink-cursor 1s step-end infinite;
            box-shadow: 0 0 4px #a855f7, 0 0 8px #a855f7;
        }
        @keyframes blink-cursor {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0; }
        }

        /* ── ВЫДЕЛЕНИЕ ТЕКСТА ── */
        .sel {
            background: rgba(168, 85, 247, 0.45);
            border-radius: 2px;
            box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.3);
        }

        /* ── ФАЙЛОВЫЙ БЛОК ── */
        .file-section {
            margin-top: 12px;
            margin-bottom: 10px;
        }
        .file-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            transition: all 0.2s;
        }
        .file-card:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(168,85,247,0.25);
        }
        .file-icon {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(168,85,247,0.3), rgba(99,102,241,0.3));
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .file-info {
            flex: 1;
            min-width: 0;
        }
        .file-name {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-size {
            font-size: 11px;
            color: rgba(255,255,255,0.35);
            margin-top: 2px;
        }
        .file-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .file-btn {
            width: 30px; height: 30px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            padding: 0;
        }
        .file-btn:hover {
            background: rgba(168,85,247,0.2);
            border-color: rgba(168,85,247,0.4);
            color: #fff;
        }
        .file-btn.download:hover {
            background: rgba(99,241,166,0.2);
            border-color: rgba(99,241,166,0.4);
            color: #6effa8;
        }
        .file-btn.remove:hover {
            background: rgba(255,80,80,0.2);
            border-color: rgba(255,80,80,0.4);
            color: #ff8080;
        }

        /* ── КНОПКА ЗАГРУЗКИ ФАЙЛА ── */
        .upload-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        #btn-upload {
            flex: 1;
            padding: 11px 16px;
            border: 1px dashed rgba(168,85,247,0.4);
            border-radius: 12px;
            background: rgba(168,85,247,0.08);
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        #btn-upload:hover {
            background: rgba(168,85,247,0.15);
            border-color: rgba(168,85,247,0.6);
            color: #fff;
        }
        #btn-upload.uploading {
            border-style: solid;
            background: rgba(168,85,247,0.2);
        }
        #file-input {
            display: none;
        }

        /* ── Анимации ── */
        @keyframes anim-fade {
            from { opacity: 0; } to { opacity: 1; }
        }
        @keyframes anim-slide-up {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes anim-scale {
            from { opacity: 0; transform: scale(0.2); }
            to   { opacity: 1; transform: scale(1); }
        }
        @keyframes anim-glow {
            0%   { opacity:0; color:#c084fc; text-shadow:0 0 10px #a855f7,0 0 25px #a855f7; }
            50%  { opacity:1; color:#e0aaff; text-shadow:0 0 6px #a855f7; }
            100% { opacity:1; color:rgba(255,255,255,0.92); text-shadow:none; }
        }
        @keyframes anim-bounce {
            0%   { opacity:0; transform:translateY(-10px); }
            55%  { opacity:1; transform:translateY(3px); }
            75%  { transform:translateY(-2px); }
            100% { opacity:1; transform:translateY(0); }
        }
        @keyframes anim-typewriter {
            0%,49% { opacity:1; color:#c084fc; text-shadow:0 0 6px #a855f7; }
            50%,99%{ opacity:0; }
            100%   { opacity:1; color:rgba(255,255,255,0.92); text-shadow:none; }
        }

        .char {
            display: inline-block;
            white-space: pre;
            vertical-align: baseline;
        }
        .anim-fade       { animation: anim-fade       0.25s ease forwards; }
        .anim-slide-up   { animation: anim-slide-up   0.28s ease forwards; }
        .anim-scale      { animation: anim-scale       0.22s cubic-bezier(.34,1.56,.64,1) forwards; }
        .anim-glow       { animation: anim-glow        0.5s  ease forwards; }
        .anim-bounce     { animation: anim-bounce      0.35s ease forwards; }
        .anim-typewriter { animation: anim-typewriter  0.45s steps(1) forwards; }

        /* ── Статус ── */
        #sync-status {
            font-size: 11px; color: rgba(255,255,255,0.25);
            text-align: right; margin-bottom: 10px; height: 14px;
            transition: color 0.3s;
        }
        #sync-status.saving { color: rgba(168,85,247,0.7); }
        #sync-status.saved  { color: rgba(99,241,166,0.6); }

        /* ── Кнопки ── */
        .btn-row { display: flex; gap: 8px; }
        .btn-action {
            flex: 1; padding: 11px 16px; border: none;
            border-radius: 12px; font-size: 14px; font-weight: 500;
            cursor: pointer; transition: all 0.2s; width: auto; margin: 0;
        }
        #btn-copy {
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.8);
            border: 1px solid rgba(255,255,255,0.12);
        }
        #btn-copy:hover { background: rgba(255,255,255,0.14); color: #fff; }
        #btn-copy.copied {
            background: linear-gradient(135deg,rgba(99,241,166,0.3),rgba(34,197,94,0.3));
            border-color: rgba(99,241,166,0.4); color: #6effa8;
        }
        #btn-clear {
            background: rgba(255,80,80,0.1);
            color: rgba(255,120,120,0.8);
            border: 1px solid rgba(255,80,80,0.2);
        }
        #btn-clear:hover {
            background: rgba(255,80,80,0.22);
            color: #ff8080;
            border-color: rgba(255,80,80,0.4);
        }

        /* ── Авторизация ── */
        #auth-screen { text-align: center; padding: 10px 0; }
        #auth-screen h2 {
            font-size: 22px; font-weight: 700;
            color: #fff; margin-bottom: 8px;
        }
        #auth-screen p {
            font-size: 14px; color: rgba(255,255,255,0.45);
            margin-bottom: 28px; line-height: 1.5;
        }
        #btn-login {
            width: 100%; padding: 13px; border: none;
            border-radius: 14px; font-size: 15px; font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: #fff;
            box-shadow: 0 4px 20px rgba(168,85,247,0.4);
            transition: all 0.2s;
            display: flex; align-items: center;
            justify-content: center; gap: 10px; margin: 0;
        }
        #btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 28px rgba(168,85,247,0.55);
        }
        #btn-login:active { transform: translateY(0); }
        .google-icon {
            width: 20px; height: 20px; background: #fff;
            border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; color: #4285f4;
            flex-shrink: 0;
        }

        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">

    <div id="auth-screen">
        <div style="font-size:48px;margin-bottom:16px;">📝</div>
        <h2>Облачный Блокнот</h2>
        <p>Войдите через Google чтобы синхронизировать текст и файлы между устройствами</p>
        <button id="btn-login">
            <span class="google-icon">G</span>
            Войти через Google
        </button>
    </div>

    <div id="app-screen" class="hidden">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">📝</div>
                <span class="logo-text">Облачный Блокнот</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px;min-width:0;">
                <span id="user-info"></span>
                <button id="btn-logout" title="Выйти">⇥</button>
            </div>
        </div>

        <div class="divider"></div>

        <div id="anim-picker">
            <button class="anim-btn active" data-anim="none">Без эффекта</button>
            <button class="anim-btn" data-anim="anim-fade">Fade</button>
            <button class="anim-btn" data-anim="anim-slide-up">Slide Up</button>
            <button class="anim-btn" data-anim="anim-scale">Scale</button>
            <button class="anim-btn" data-anim="anim-glow">Glow</button>
            <button class="anim-btn" data-anim="anim-bounce">Bounce</button>
            <button class="anim-btn" data-anim="anim-typewriter">Typewriter</button>
        </div>

        <div class="input-wrapper">
            <textarea id="real-input" autocomplete="off" autocorrect="off"
                      autocapitalize="off" spellcheck="false"></textarea>
            <div id="display-layer" class="empty"></div>
        </div>

        <div id="sync-status">—</div>

        <!-- Файловый блок -->
        <div class="upload-row">
            <button id="btn-upload">
                <span>📎</span>
                <span id="upload-label">Прикрепить файл</span>
            </button>
            <input type="file" id="file-input">
        </div>

        <div id="file-section" class="file-section hidden">
            <div id="file-card" class="file-card">
                <div class="file-icon" id="file-icon">📄</div>
                <div class="file-info">
                    <div class="file-name" id="file-name">—</div>
                    <div class="file-size" id="file-size">—</div>
                </div>
                <div class="file-actions">
                    <button class="file-btn download" id="btn-file-download" title="Скачать">⬇</button>
                    <button class="file-btn remove" id="btn-file-remove" title="Убрать файл">✕</button>
                </div>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn-action" id="btn-copy">Копировать всё</button>
            <button class="btn-action" id="btn-clear">Очистить всё</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged }
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue, remove }
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject }
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC6JayNN_rZcn8o9scI5gBEVKO6xXhQLV4",
        authDomain: "text-transmission-7aa49.firebaseapp.com",
        databaseURL: "https://text-transmission-7aa49-default-rtdb.firebaseio.com",
        projectId: "text-transmission-7aa49",
        storageBucket: "text-transmission-7aa49.firebasestorage.app",
        messagingSenderId: "749005357603",
        appId: "1:749005357603:web:a3d567ce1b91350336a796"
    };

    const app      = initializeApp(firebaseConfig);
    const auth     = getAuth(app);
    const db       = getDatabase(app);
    const storage  = getStorage(app);
    const provider = new GoogleAuthProvider();

    const authScreen   = document.getElementById('auth-screen');
    const appScreen    = document.getElementById('app-screen');
    const btnLogin     = document.getElementById('btn-login');
    const btnLogout    = document.getElementById('btn-logout');
    const btnCopy      = document.getElementById('btn-copy');
    const btnClear     = document.getElementById('btn-clear');
    const realInput    = document.getElementById('real-input');
    const displayLayer = document.getElementById('display-layer');
    const userInfo     = document.getElementById('user-info');
    const animPicker   = document.getElementById('anim-picker');
    const syncStatus   = document.getElementById('sync-status');

    // Файловые элементы
    const btnUpload      = document.getElementById('btn-upload');
    const fileInput      = document.getElementById('file-input');
    const uploadLabel    = document.getElementById('upload-label');
    const fileSection    = document.getElementById('file-section');
    const fileNameEl     = document.getElementById('file-name');
    const fileSizeEl     = document.getElementById('file-size');
    const fileIconEl     = document.getElementById('file-icon');
    const btnFileDownload = document.getElementById('btn-file-download');
    const btnFileRemove  = document.getElementById('btn-file-remove');

    let currentUser    = null;
    let isTyping       = false;
    let typingTimeout  = null;
    let isRemoteUpdate = false;
    let currentAnim    = 'none';
    let lastValue      = '';
    let syncTimeout    = null;
    let cursorPos      = 0;
    let selStart       = 0;
    let selEnd         = 0;
    let currentFile    = null; // { name, size, type, url, path }

    // ── Выбор анимации ────────────────────────────────────────────────────────
    animPicker.addEventListener('click', (e) => {
        const btn = e.target.closest('.anim-btn');
        if (!btn) return;
        document.querySelectorAll('.anim-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentAnim = btn.dataset.anim;
    });

    // ── Статус ────────────────────────────────────────────────────────────────
    function setStatus(text, cls) {
        syncStatus.textContent = text;
        syncStatus.className = cls || '';
        clearTimeout(syncTimeout);
        if (cls === 'saved') {
            syncTimeout = setTimeout(() => {
                syncStatus.textContent = '—';
                syncStatus.className = '';
            }, 2000);
        }
    }

    // ── Получить позицию и выделение ──────────────────────────────────────────
    function getSelectionState() {
        return {
            cursor: realInput.selectionStart,
            selStart: realInput.selectionStart,
            selEnd: realInput.selectionEnd
        };
    }

    // ── Рендер display-layer ──────────────────────────────────────────────────
    function renderDisplay(newText, animStart, animEnd) {
        const sel = getSelectionState();
        cursorPos = sel.cursor;
        selStart = sel.selStart;
        selEnd = sel.selEnd;

        if (newText === '') {
            displayLayer.classList.add('empty');
        } else {
            displayLayer.classList.remove('empty');
        }

        const hasSelection = selStart !== selEnd;
        const hasAnim = animStart !== -1 && animEnd !== -1 && currentAnim !== 'none';

        if (!hasAnim && !hasSelection && cursorPos === newText.length) {
            displayLayer.textContent = newText;
            if (document.activeElement === realInput) {
                const cursor = document.createElement('span');
                cursor.className = 'cursor';
                displayLayer.appendChild(cursor);
            }
            return;
        }

        displayLayer.innerHTML = '';

        for (let i = 0; i < newText.length; i++) {
            const ch = newText[i];
            const inSelection = hasSelection && i >= selStart && i < selEnd;
            const inAnim = hasAnim && i >= animStart && i < animEnd && (animEnd - animStart) <= 20;

            let node;
            if (inAnim) {
                node = document.createElement('span');
                node.className = `char ${currentAnim}`;
                node.textContent = ch;
            } else if (inSelection) {
                node = document.createElement('span');
                node.className = 'sel';
                node.textContent = ch;
            } else {
                node = document.createTextNode(ch);
            }
            displayLayer.appendChild(node);

            if (cursorPos === i + 1 && !hasSelection && document.activeElement === realInput) {
                const cursor = document.createElement('span');
                cursor.className = 'cursor';
                displayLayer.appendChild(cursor);
            }
        }

        if (cursorPos === 0 && !hasSelection && document.activeElement === realInput) {
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            displayLayer.insertBefore(cursor, displayLayer.firstChild);
        }

        if (newText === '' && !hasSelection && document.activeElement === realInput) {
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            displayLayer.appendChild(cursor);
        }
    }

    // ── Тихая загрузка из Firebase ────────────────────────────────────────────
    function loadTextSilently(text) {
        isRemoteUpdate = true;
        realInput.value = text;
        lastValue = text;
        cursorPos = text.length;
        displayLayer.textContent = text;
        if (text === '') {
            displayLayer.classList.add('empty');
        } else {
            displayLayer.classList.remove('empty');
        }
        isRemoteUpdate = false;
    }

    // ── Сохранение текста ─────────────────────────────────────────────────────
    function saveText(text) {
        if (!currentUser) return;
        isTyping = true;
        setStatus('Сохранение...', 'saving');
        set(ref(db, 'users/' + currentUser.uid + '/text'), text)
            .then(() => setStatus('Сохранено ✓', 'saved'))
            .catch(e => { console.error(e); setStatus('Ошибка', ''); });
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => { isTyping = false; }, 1000);
    }

    // ── Обработка ввода ───────────────────────────────────────────────────────
    realInput.addEventListener('input', () => {
        if (isRemoteUpdate) return;

        const newValue = realInput.value;
        if (newValue === lastValue) return;

        const oldValue = lastValue;
        lastValue = newValue;

        let start = 0;
        while (start < oldValue.length && start < newValue.length && oldValue[start] === newValue[start]) {
            start++;
        }
        let oldEnd = oldValue.length;
        let newEnd = newValue.length;
        while (oldEnd > start && newEnd > start && oldValue[oldEnd-1] === newValue[newEnd-1]) {
            oldEnd--;
            newEnd--;
        }

        const insertedLen  = newEnd - start;
        const deletedCount = oldEnd - start;

        const shouldAnimate = deletedCount === 0 && insertedLen > 0 && insertedLen <= 20;

        const aStart = shouldAnimate ? start : -1;
        const aEnd   = shouldAnimate ? newEnd : -1;

        renderDisplay(newValue, aStart, aEnd);
        saveText(newValue);
    });

    displayLayer.addEventListener('click', () => realInput.focus());

    realInput.addEventListener('scroll', () => {
        displayLayer.scrollTop = realInput.scrollTop;
    });

    realInput.addEventListener('focus', () => {
        displayLayer.classList.add('focused');
        renderDisplay(lastValue, -1, -1);
    });
    realInput.addEventListener('blur', () => {
        displayLayer.classList.remove('focused');
        renderDisplay(lastValue, -1, -1);
    });

    ['keydown', 'keyup', 'click', 'select', 'selectionchange'].forEach(evt => {
        realInput.addEventListener(evt, () => {
            if (!isRemoteUpdate) {
                requestAnimationFrame(() => {
                    renderDisplay(lastValue, -1, -1);
                });
            }
        });
    });

    // ════════════════════════════════════════════════════════════════════════
    //  ФАЙЛЫ — загрузка, скачивание, удаление
    // ════════════════════════════════════════════════════════════════════════

    // Иконка по типу файла
    function getFileIcon(type, name) {
        if (type?.startsWith('image/')) return '🖼';
        if (type?.startsWith('video/')) return '🎬';
        if (type?.startsWith('audio/')) return '🎵';
        if (type?.startsWith('text/') || name?.endsWith('.txt') || name?.endsWith('.md')) return '📝';
        if (name?.endsWith('.pdf')) return '📕';
        if (name?.endsWith('.zip') || name?.endsWith('.rar') || name?.endsWith('.7z')) return '📦';
        if (name?.endsWith('.doc') || name?.endsWith('.docx')) return '📘';
        if (name?.endsWith('.xls') || name?.endsWith('.xlsx')) return '📗';
        if (name?.endsWith('.ppt') || name?.endsWith('.pptx')) return '📙';
        if (name?.endsWith('.js') || name?.endsWith('.html') || name?.endsWith('.css') || name?.endsWith('.py')) return '💻';
        return '📄';
    }

    // Формат размера
    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' Б';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' КБ';
        if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' МБ';
        return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' ГБ';
    }

    // Показать файл
    function showFile(fileData) {
        if (!fileData) {
            currentFile = null;
            fileSection.classList.add('hidden');
            uploadLabel.textContent = 'Прикрепить файл';
            btnUpload.classList.remove('uploading');
            return;
        }
        currentFile = fileData;
        fileNameEl.textContent = fileData.name;
        fileSizeEl.textContent = formatSize(fileData.size);
        fileIconEl.textContent = getFileIcon(fileData.type, fileData.name);
        fileSection.classList.remove('hidden');
        uploadLabel.textContent = 'Заменить файл';
    }

    // ── Загрузка файла ──────────────────────────────────────────────────────
    btnUpload.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file || !currentUser) return;

        // Удалить старый файл если есть
        if (currentFile?.path) {
            try { await deleteObject(storageRef(storage, currentFile.path)); } catch(e) {}
        }

        btnUpload.classList.add('uploading');
        uploadLabel.textContent = 'Загрузка...';
        setStatus('Загрузка файла...', 'saving');

        const path = `users/${currentUser.uid}/files/${Date.now()}_${file.name}`;
        const sRef = storageRef(storage, path);

        try {
            await uploadBytes(sRef, file);
            const url = await getDownloadURL(sRef);

            const fileData = {
                name: file.name,
                size: file.size,
                type: file.type,
                url: url,
                path: path,
                uploadedAt: Date.now()
            };

            await set(ref(db, 'users/' + currentUser.uid + '/file'), fileData);
            showFile(fileData);
            setStatus('Файл загружен ✓', 'saved');
        } catch (err) {
            console.error(err);
            setStatus('Ошибка загрузки', '');
            uploadLabel.textContent = 'Прикрепить файл';
            btnUpload.classList.remove('uploading');
        }

        fileInput.value = '';
    });

    // ── Скачать файл ────────────────────────────────────────────────────────
    btnFileDownload.addEventListener('click', () => {
        if (!currentFile?.url) return;
        const a = document.createElement('a');
        a.href = currentFile.url;
        a.download = currentFile.name;
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });

    // ── Убрать файл ─────────────────────────────────────────────────────────
    btnFileRemove.addEventListener('click', async () => {
        if (!currentUser || !currentFile) return;

        setStatus('Удаление...', 'saving');
        try {
            if (currentFile.path) {
                await deleteObject(storageRef(storage, currentFile.path));
            }
            await remove(ref(db, 'users/' + currentUser.uid + '/file'));
            showFile(null);
            setStatus('Файл удалён', 'saved');
        } catch (err) {
            console.error(err);
            setStatus('Ошибка удаления', '');
        }
    });

    // ════════════════════════════════════════════════════════════════════════
    //  AUTH
    // ════════════════════════════════════════════════════════════════════════

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            userInfo.textContent = user.email;
            authScreen.classList.add('hidden');
            appScreen.classList.remove('hidden');

            // Текст
            const textRef = ref(db, 'users/' + user.uid + '/text');
            onValue(textRef, (snapshot) => {
                const data = snapshot.val() ?? '';
                if (!isTyping) loadTextSilently(data);
            });

            // Файл
            const fileRef = ref(db, 'users/' + user.uid + '/file');
            onValue(fileRef, (snapshot) => {
                const data = snapshot.val();
                showFile(data);
            });
        } else {
            currentUser = null;
            authScreen.classList.remove('hidden');
            appScreen.classList.add('hidden');
            realInput.value = '';
            displayLayer.textContent = '';
            displayLayer.classList.add('empty');
            lastValue = '';
            showFile(null);
        }
    });

    // ── Кнопка Копировать ─────────────────────────────────────────────────────
    btnCopy.addEventListener('click', () => {
        if (!realInput.value) return;
        navigator.clipboard.writeText(realInput.value).then(() => {
            btnCopy.textContent = '✓ Скопировано';
            btnCopy.classList.add('copied');
            setTimeout(() => {
                btnCopy.textContent = 'Копировать всё';
                btnCopy.classList.remove('copied');
            }, 1500);
        }).catch(e => console.error(e));
    });

    // ── Кнопка Очистить ───────────────────────────────────────────────────────
    btnClear.addEventListener('click', () => {
        if (!realInput.value) return;
        realInput.value = '';
        lastValue = '';
        displayLayer.textContent = '';
        displayLayer.classList.add('empty');
        saveText('');
        realInput.focus();
    });

    // ── Логин / Выход ─────────────────────────────────────────────────────────
    btnLogin.addEventListener('click', () => {
        signInWithPopup(auth, provider).catch(e => console.error(e));
    });
    btnLogout.addEventListener('click', () => {
        signOut(auth).catch(e => console.error(e));
    });
</script>
</body>
