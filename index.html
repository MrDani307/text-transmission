
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17142e">
<title>Облачный Блокнот</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
body{
 font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;
 display:flex;justify-content:center;align-items:center;padding:16px;
 background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
 position:relative;isolation:isolate;
}
body:before,body:after{
 content:"";position:fixed;width:380px;height:380px;border-radius:50%;
 filter:blur(90px);opacity:.3;pointer-events:none;z-index:-1
}
body:before{background:#7b2ff7;top:-150px;left:-150px}
body:after{background:#0066ff;bottom:-150px;right:-150px}
button{font-family:inherit}
.container{
 width:100%;max-width:620px;position:relative;
 background:rgba(255,255,255,.07);backdrop-filter:blur(24px);
 -webkit-backdrop-filter:blur(24px);
 border:1px solid rgba(255,255,255,.15);border-radius:24px;
 padding:clamp(16px,4vw,28px);
 box-shadow:0 8px 32px #0005,inset 0 1px 0 #ffffff20;
}
.hidden{display:none!important}
.header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:20px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo-icon{
 width:36px;height:36px;flex-shrink:0;border-radius:10px;
 display:grid;place-items:center;font-size:18px;
 background:linear-gradient(135deg,#a855f7,#6366f1);
 box-shadow:0 0 16px #a855f780
}
.logo-text{font-size:16px;font-weight:600;color:#ffffffe8}
.account{display:flex;align-items:center;gap:6px;min-width:0}
#user-info{
 font-size:12px;color:#ffffff73;max-width:145px;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
#btn-logout{
 width:34px;height:34px;flex-shrink:0;border-radius:10px;
 background:#ffffff12;border:1px solid #ffffff20;
 color:#ff7777;font-size:18px;cursor:pointer
}
.divider{height:1px;background:#ffffff12;margin:18px 0}
#anim-picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.anim-btn{
 padding:6px 11px;border-radius:20px;font-size:12px;
 background:#ffffff0d;color:#ffffff80;border:1px solid #ffffff1a;
 cursor:pointer;transition:.2s
}
.anim-btn:hover,.anim-btn.active{
 background:#a855f755;border-color:#a855f7aa;color:white
}
.input-wrapper{
 height:240px;min-height:120px;max-height:520px;
 resize:vertical;overflow:hidden;margin-bottom:10px;
 background:#00000040;border:1px solid #ffffff1a;
 border-radius:14px;transition:border-color .2s,box-shadow .2s
}
.input-wrapper:focus-within{
 border-color:#a855f780;box-shadow:0 0 0 3px #a855f720
}
#editor{height:100%;font-size:14px}
#editor .cm-editor{height:100%;background:transparent;color:#eeeeff}
#editor .cm-editor.cm-focused{outline:none}
#editor .cm-scroller{
 overflow:auto;font-family:Consolas,'Courier New',monospace;
 line-height:1.65
}
#editor .cm-content{padding:14px 16px;caret-color:#c084fc}
#editor .cm-line{padding:0}
#editor .cm-cursor{border-left-color:#c084fc}
#editor .cm-selectionBackground,
#editor .cm-editor.cm-focused .cm-selectionBackground{
 background:#a855f766!important
}
#editor .cm-gutters{background:transparent;border:0;color:#ffffff40}
#editor .cm-activeLine{background:#a855f70a}
#editor .cm-activeLineGutter{background:#a855f712}
#editor .cm-tooltip{background:#25213d;border:1px solid #ffffff25;color:white}
#editor .cm-tooltip-autocomplete ul li[aria-selected]{background:#7c3aed}
#sync-status{
 font-size:11px;color:#ffffff55;text-align:right;
 margin-bottom:10px;min-height:14px;transition:color .2s
}
#sync-status.saving{color:#c084fc}
#sync-status.saved{color:#63f1a6}
.upload-row{display:flex;gap:8px;margin-bottom:10px}
#btn-upload{
 width:100%;padding:11px 14px;border:1px dashed #a855f766;
 border-radius:12px;background:#a855f714;color:#ffffffbb;
 font-size:14px;cursor:pointer;transition:.2s
}
#btn-upload:hover{background:#a855f72b;color:white}
#btn-upload.uploading{border-style:solid;background:#a855f733}
#btn-upload.error{border-color:#ff6464;color:#ff8585}
#file-input{display:none}
.file-section{margin:12px 0 10px}
.file-card{
 display:flex;align-items:center;gap:10px;padding:11px;
 background:#ffffff0b;border:1px solid #ffffff15;
 border-radius:12px
}
.file-icon{
 width:38px;height:38px;flex-shrink:0;border-radius:10px;
 background:#a855f733;display:grid;place-items:center;font-size:18px
}
.file-info{flex:1;min-width:0}
.file-name{font-size:13px;color:#ffffffeb;overflow-wrap:anywhere}
.file-size{font-size:11px;color:#ffffff60;margin-top:3px}
.file-actions{display:flex;gap:5px}
.file-btn{
 width:30px;height:30px;border-radius:8px;
 border:1px solid #ffffff20;background:#ffffff0d;
 color:#ffffffbb;cursor:pointer
}
.file-btn.download:hover{color:#6effa8}
.file-btn.remove:hover{color:#ff8080}
.btn-row{display:flex;gap:8px}
.btn-action{
 flex:1;padding:11px 10px;border-radius:12px;
 font-size:13px;font-weight:500;cursor:pointer;transition:.2s
}
#btn-copy{background:#ffffff12;color:#ffffffdc;border:1px solid #ffffff20}
#btn-copy:hover{background:#ffffff20}
#btn-copy.copied{background:#63f1a633;color:#6effa8}
#btn-clear{background:#ff505019;color:#ff9999;border:1px solid #ff505033}
#btn-clear:hover{background:#ff505035}
#auth-screen{text-align:center;padding:16px 0}
.auth-icon{font-size:46px;margin-bottom:16px}
#auth-screen h2{font-size:23px;color:white;margin-bottom:9px}
#auth-screen p{font-size:14px;line-height:1.6;color:#ffffff80;margin-bottom:24px}
#btn-login{
 width:100%;padding:13px;border:0;border-radius:14px;
 background:linear-gradient(135deg,#a855f7,#6366f1);
 color:white;font-size:15px;font-weight:600;cursor:pointer;
 box-shadow:0 4px 20px #a855f740
}
#btn-login:disabled{opacity:.6;cursor:wait}
.google-icon{
 display:inline-grid;place-items:center;width:21px;height:21px;
 margin-right:8px;border-radius:50%;background:white;color:#4285f4
}
@media(max-width:420px){
 body{padding:10px;align-items:flex-start;padding-top:16px}
 .container{border-radius:19px;padding:16px}
 .logo-text{font-size:14px}
 #user-info{max-width:85px}
 .input-wrapper{height:220px}
 .btn-action{font-size:12px;padding:11px 6px}
}
</style>
</head>
<body>
<div class="container">

 <div id="auth-screen">
  <div class="auth-icon">📝</div>
  <h2>Облачный Блокнот</h2>
  <p>Войдите через Google, чтобы синхронизировать текст и файлы между устройствами.</p>
  <button id="btn-login"><span class="google-icon">G</span>Войти через Google</button>
 </div>

 <div id="app-screen" class="hidden">
  <div class="header">
   <div class="logo">
    <div class="logo-icon">📝</div>
    <span class="logo-text">Облачный Блокнот</span>
   </div>
   <div class="account">
    <span id="user-info"></span>
    <button id="btn-logout" title="Выйти" aria-label="Выйти">⇥</button>
   </div>
  </div>

  <div class="divider"></div>

  <div id="anim-picker">
   <button class="anim-btn active" data-anim="none">Без эффекта</button>
   <button class="anim-btn" data-anim="anim-fade">Fade</button>
   <button class="anim-btn" data-anim="anim-slide-up">Slide Up</button>
   <button class="anim-btn" data-anim="anim-scale">Scale</button>
   <button class="anim-btn" data-anim="anim-glow">Glow</button>
   <button class="anim-btn" data-anim="anim-bounce">Bounce</button>
   <button class="anim-btn" data-anim="anim-typewriter">Typewriter</button>
  </div>

  <div class="input-wrapper">
   <div id="editor"></div>
  </div>

  <div id="sync-status" aria-live="polite">—</div>

  <div class="upload-row">
   <button id="btn-upload"><span>📎</span> <span id="upload-label">Прикрепить файл</span></button>
   <input type="file" id="file-input">
  </div>

  <div id="file-section" class="file-section hidden">
   <div class="file-card">
    <div class="file-icon" id="file-icon">📄</div>
    <div class="file-info">
     <div class="file-name" id="file-name">—</div>
     <div class="file-size" id="file-size">—</div>
    </div>
    <div class="file-actions">
     <button class="file-btn download" id="btn-file-download" title="Скачать">⬇</button>
     <button class="file-btn remove" id="btn-file-remove" title="Убрать файл">✕</button>
    </div>
   </div>
  </div>

  <div class="btn-row">
   <button class="btn-action" id="btn-copy">Копировать всё</button>
   <button class="btn-action" id="btn-clear">Очистить всё</button>
  </div>
 </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
 getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {
 getDatabase, ref, set, onValue, remove
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

import {basicSetup} from "https://esm.sh/codemirror@6.0.1?bundle";
import {EditorView} from "https://esm.sh/@codemirror/view@6.38.6?bundle";
import {EditorState} from "https://esm.sh/@codemirror/state@6.5.2?bundle";
import {defaultHighlightStyle, syntaxHighlighting} from "https://esm.sh/@codemirror/language@6.11.2?bundle";
import {html} from "https://esm.sh/@codemirror/lang-html@6.4.11?bundle";
import {javascript} from "https://esm.sh/@codemirror/lang-javascript@6.2.4?bundle";
import {css} from "https://esm.sh/@codemirror/lang-css@6.3.1?bundle";
import {json} from "https://esm.sh/@codemirror/lang-json@6.0.2?bundle";

const firebaseConfig = {
 apiKey:"AIzaSyC6JayNN_rZcn8o9scI5gBEVKO6xXhQLV4",
 authDomain:"text-transmission-7aa49.firebaseapp.com",
 databaseURL:"https://text-transmission-7aa49-default-rtdb.firebaseio.com",
 projectId:"text-transmission-7aa49",
 storageBucket:"text-transmission-7aa49.firebasestorage.app",
 messagingSenderId:"749005357603",
 appId:"1:749005357603:web:a3d567ce1b91350336a796"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const provider=new GoogleAuthProvider();

const $=id=>document.getElementById(id);
const authScreen=$("auth-screen");
const appScreen=$("app-screen");
const btnLogin=$("btn-login");
const btnLogout=$("btn-logout");
const btnCopy=$("btn-copy");
const btnClear=$("btn-clear");
const userInfo=$("user-info");
const syncStatus=$("sync-status");
const animPicker=$("anim-picker");
const btnUpload=$("btn-upload");
const fileInput=$("file-input");
const uploadLabel=$("upload-label");
const fileSection=$("file-section");
const fileNameEl=$("file-name");
const fileSizeEl=$("file-size");
const fileIconEl=$("file-icon");
const btnFileDownload=$("btn-file-download");
const btnFileRemove=$("btn-file-remove");

let currentUser=null;
let isRemoteUpdate=false;
let lastValue="";
let currentAnim="none";
let currentFile=null;
let syncTimer=null;
let saveTimer=null;
let textUnsubscribe=null;
let fileUnsubscribe=null;
let authBusy=false;
let pendingRemoteText=null;
let lastLocalEdit=0;

const editor=new EditorView({
 parent:$("editor"),
 state:EditorState.create({
  doc:"",
  extensions:[
   basicSetup,
   EditorView.lineWrapping,
   syntaxHighlighting(defaultHighlightStyle,{fallback:true}),
   EditorView.theme({
    "&":{height:"100%",backgroundColor:"transparent",color:"#eeeeff"},
    ".cm-content":{caretColor:"#c084fc"},
    ".cm-cursor":{borderLeftColor:"#c084fc"},
    "&.cm-focused":{outline:"none"},
    ".cm-selectionBackground":{backgroundColor:"#a855f766"},
    "&.cm-focused .cm-selectionBackground":{backgroundColor:"#a855f766"},
    ".cm-gutters":{backgroundColor:"transparent",border:"none",color:"#ffffff40"},
    ".cm-activeLine":{backgroundColor:"#a855f70a"},
    ".cm-tooltip":{backgroundColor:"#25213d",border:"1px solid #ffffff25",color:"white"},
    ".cm-tooltip-autocomplete ul li[aria-selected]":{backgroundColor:"#7c3aed"}
   }),
   EditorView.updateListener.of(update=>{
    if(!update.docChanged || isRemoteUpdate) return;
    const value=update.state.doc.toString();
    lastValue=value;
    lastLocalEdit=Date.now();
    if(pendingRemoteText!==null){
     pendingRemoteText=null;
    }
    scheduleSave(value);
   })
  ]
 })
});

function getText(){
 return editor.state.doc.toString();
}

function setEditorText(text){
 const value=String(text??"");
 if(getText()===value)return;
 editor.dispatch({
  changes:{from:0,to:editor.state.doc.length,insert:value}
 });
}

function setStatus(text,cls=""){
 syncStatus.textContent=text;
 syncStatus.className=cls;
 clearTimeout(syncTimer);
 if(cls==="saved"){
  syncTimer=setTimeout(()=>{
   syncStatus.textContent="—";
   syncStatus.className="";
  },2500);
 }
}

function scheduleSave(text){
 if(!currentUser)return;
 clearTimeout(saveTimer);
 setStatus("Изменения…","saving");
 saveTimer=setTimeout(()=>saveText(text),450);
}

async function saveText(text){
 if(!currentUser)return;
 const userAtSave=currentUser;
 setStatus("Сохранение…","saving");
 try{
  await set(ref(db,"users/"+userAtSave.uid+"/text"),text);
  if(currentUser?.uid===userAtSave.uid){
   setStatus("Сохранено ✓","saved");
  }
 }catch(error){
  console.error(error);
  setStatus("Ошибка сохранения","");
 }
}

function loadTextSilently(text){
 const value=String(text??"");
 isRemoteUpdate=true;
 setEditorText(value);
 lastValue=value;
 isRemoteUpdate=false;
}

function applyRemoteText(value){
 value=String(value??"");
 if(value===getText())return;
 if(Date.now()-lastLocalEdit<1500){
  pendingRemoteText=value;
  return;
 }
 pendingRemoteText=null;
 loadTextSilently(value);
}

function getFileIcon(type,name){
 const ext=(name||"").toLowerCase();
 if(type?.startsWith("image/"))return "🖼";
 if(type?.startsWith("video/"))return "🎬";
 if(type?.startsWith("audio/"))return "🎵";
 if(type?.startsWith("text/")||/\.(txt|md|lua|js|html|css|py|json)$/.test(ext))return "📝";
 if(ext.endsWith(".pdf"))return "📕";
 if(/\.(zip|rar|7z)$/.test(ext))return "📦";
 if(/\.(doc|docx)$/.test(ext))return "📘";
 if(/\.(xls|xlsx)$/.test(ext))return "📗";
 if(/\.(ppt|pptx)$/.test(ext))return "📙";
 return "📄";
}

function formatSize(bytes){
 if(bytes<1024)return bytes+" Б";
 if(bytes<1024*1024)return (bytes/1024).toFixed(1)+" КБ";
 if(bytes<1024*1024*1024)return (bytes/1048576).toFixed(1)+" МБ";
 return (bytes/1073741824).toFixed(1)+" ГБ";
}

function resetUploadBtn(){
 btnUpload.classList.remove("uploading","error");
 uploadLabel.textContent=currentFile?"Заменить файл":"Прикрепить файл";
}

function showFile(data){
 currentFile=data||null;
 if(!data){
  fileSection.classList.add("hidden");
  resetUploadBtn();
  return;
 }
 fileNameEl.textContent=data.name||"Файл";
 fileSizeEl.textContent=formatSize(data.size||0);
 fileIconEl.textContent=getFileIcon(data.type,data.name);
 fileSection.classList.remove("hidden");
 uploadLabel.textContent="Заменить файл";
}

function fileToBase64(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve(reader.result);
  reader.onerror=()=>reject(reader.error||new Error("Не удалось прочитать файл"));
  reader.readAsDataURL(file);
});

async function uploadFile(file){
 if(!currentUser)return;
 btnUpload.classList.add("uploading");
 btnUpload.classList.remove("error");
 uploadLabel.textContent="Загрузка…";
 setStatus("Загрузка файла…","saving");
 try{
  const base64=await fileToBase64(file);
  if(base64.length>9*1024*1024){
   throw new Error("Файл слишком большой. Попробуй файл меньшего размера.");
  }
  const data={
   name:file.name,
   size:file.size,
   type:file.type,
   data:base64,
   uploadedAt:Date.now()
  };
  await set(ref(db,"users/"+currentUser.uid+"/file"),data);
  showFile(data);
  setStatus("Файл загружен ✓","saved");
 }catch(error){
  console.error(error);
  btnUpload.classList.add("error");
  uploadLabel.textContent="Ошибка загрузки";
  setStatus(error.message||"Ошибка загрузки","");
  setTimeout(resetUploadBtn,3000);
 }
}

function stopListeners(){
 if(textUnsubscribe){textUnsubscribe();textUnsubscribe=null;}
 if(fileUnsubscribe){fileUnsubscribe();fileUnsubscribe=null;}
 clearTimeout(saveTimer);
 pendingRemoteText=null;
}

function clearUserDataFromView(){
 isRemoteUpdate=true;
 setEditorText("");
 lastValue="";
 isRemoteUpdate=false;
 showFile(null);
}

animPicker.addEventListener("click",event=>{
 const button=event.target.closest(".anim-btn");
 if(!button)return;
 document.querySelectorAll(".anim-btn").forEach(item=>item.classList.remove("active"));
 button.classList.add("active");
 currentAnim=button.dataset.anim;
 // CodeMirror uses its own renderer. The legacy character animations
 // are retained as selectable UI options but do not alter the editor.
});

btnUpload.addEventListener("click",()=>fileInput.click());

fileInput.addEventListener("change",event=>{
 const file=event.target.files?.[0];
 if(file)uploadFile(file);
 fileInput.value="";
});

btnFileDownload.addEventListener("click",()=>{
 if(!currentFile?.data)return;
 const a=document.createElement("a");
 a.href=currentFile.data;
 a.download=currentFile.name||"download";
 document.body.appendChild(a);
 a.click();
 a.remove();
});

btnFileRemove.addEventListener("click",async()=>{
 if(!currentUser||!currentFile)return;
 setStatus("Удаление файла…","saving");
 try{
  await remove(ref(db,"users/"+currentUser.uid+"/file"));
  showFile(null);
  setStatus("Файл удалён ✓","saved");
 }catch(error){
  console.error(error);
  setStatus("Ошибка удаления","");
 }
});

btnCopy.addEventListener("click",async()=>{
 const text=getText();
 if(!text)return;
 try{
  await navigator.clipboard.writeText(text);
  btnCopy.textContent="✓ Скопировано";
  btnCopy.classList.add("copied");
  setTimeout(()=>{
   btnCopy.textContent="Копировать всё";
   btnCopy.classList.remove("copied");
  },1500);
 }catch(error){
  console.error(error);
  setStatus("Не удалось скопировать текст","");
 }
});

btnClear.addEventListener("click",()=>{
 if(!getText())return;
 editor.dispatch({
  changes:{from:0,to:editor.state.doc.length,insert:""}
 });
 editor.focus();
});

btnLogin.addEventListener("click",async()=>{
 if(authBusy)return;
 authBusy=true;
 btnLogin.disabled=true;
 try{
  await signInWithPopup(auth,provider);
 }catch(error){
  console.error(error);
  setStatus("Не удалось войти через Google","");
 }finally{
  authBusy=false;
  btnLogin.disabled=false;
 }
});

btnLogout.addEventListener("click",async()=>{
 try{
  await signOut(auth);
 }catch(error){
  console.error(error);
  setStatus("Не удалось выйти","");
 }
});

onAuthStateChanged(auth,user=>{
 stopListeners();
 currentUser=user;

 if(!user){
  authScreen.classList.remove("hidden");
  appScreen.classList.add("hidden");
  clearUserDataFromView();
  userInfo.textContent="";
  return;
 }

 userInfo.textContent=user.email||"Google";
 authScreen.classList.add("hidden");
 appScreen.classList.remove("hidden");

 const userTextRef=ref(db,"users/"+user.uid+"/text");
 textUnsubscribe=onValue(userTextRef,snapshot=>{
  const remoteText=snapshot.val()??"";
  if(Date.now()-lastLocalEdit<1500 && remoteText!==lastValue){
   pendingRemoteText=remoteText;
   return;
  }
  applyRemoteText(remoteText);
 },error=>{
  console.error(error);
  setStatus("Ошибка синхронизации","");
 });

 const userFileRef=ref(db,"users/"+user.uid+"/file");
 fileUnsubscribe=onValue(userFileRef,snapshot=>{
  showFile(snapshot.val());
 },error=>{
  console.error(error);
  setStatus("Ошибка загрузки файла","");
 });
});
</script>
</body>
</html>
