<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Облачный Блокнот v4</title>

<style>
:root {
    color-scheme: dark;
    --bg: #0b0d12;
    --panel: #141821;
    --panel2: #1b202b;
    --border: #2a3140;
    --text: #e7eaf0;
    --muted: #9099aa;
    --accent: #8b7cff;
    --danger: #ff7272;
    --success: #6dd6a0;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button, input, select {
    font: inherit;
}

button {
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 10px;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

button.primary {
    background: var(--accent);
    color: #fff;
    border-color: transparent;
}

button:hover:not(:disabled) {
    filter: brightness(1.12);
}

input, select {
    width: 100%;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    color: var(--text);
    outline: none;
}

input:focus, select:focus {
    border-color: var(--accent);
}

#login-screen {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-card {
    width: 100%;
    max-width: 400px;
    padding: 26px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
}

.login-card h1 {
    margin: 0 0 8px;
    font-size: 25px;
}

.muted {
    color: var(--muted);
    font-size: 14px;
}

#login-error {
    color: var(--danger);
    font-size: 13px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    margin-top: 12px;
}

#app {
    display: none;
    min-height: 100dvh;
    flex-direction: column;
}

header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
}

.brand {
    font-weight: 700;
    font-size: 17px;
    white-space: nowrap;
}

.header-spacer {
    flex: 1;
}

#user-info {
    color: var(--muted);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 180px;
}

.toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 10px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
}

.toolbar select {
    width: auto;
    flex: 1;
    min-width: 130px;
    max-width: 240px;
    padding: 10px;
}

#save-status {
    margin-left: auto;
    color: var(--muted);
    font-size: 12px;
}

#save-status.error {
    color: var(--danger);
}

#save-status.saved {
    color: var(--success);
}

.editor-shell {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 12px;
}

#editor {
    flex: 1;
    min-height: 300px;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #0f1219;
}

.cm-editor {
    height: 100%;
    font-size: 14px;
}

.cm-scroller {
    overflow: auto;
}

.cm-gutters {
    background: #11151d !important;
    border-right: 1px solid var(--border) !important;
    color: #697386 !important;
}

.cm-activeLineGutter,
.cm-activeLine {
    background: #ffffff08 !important;
}

.files-panel {
    margin: 0 12px 12px;
    padding: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
}

.files-header {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

.files-header strong {
    margin-right: auto;
}

#file-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.file-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-wrap: anywhere;
}

.file-name {
    flex: 1;
    min-width: 0;
    font-size: 13px;
}

.file-size {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
}

.empty {
    color: var(--muted);
    font-size: 13px;
    padding: 8px 0;
}

#app-error {
    display: none;
    margin: 12px;
    padding: 12px;
    color: var(--danger);
    background: #ff727210;
    border: 1px solid #ff727240;
    border-radius: 10px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 13px;
}

@media (max-width: 520px) {
    header {
        padding: 10px;
    }

    .brand {
        font-size: 15px;
    }

    #user-info {
        max-width: 90px;
    }

    .toolbar {
        gap: 6px;
        padding: 8px;
    }

    .toolbar button {
        padding: 9px 10px;
        font-size: 12px;
    }

    .editor-shell {
        padding: 8px;
    }

    #editor {
        min-height: 45dvh;
    }

    .files-panel {
        margin: 0 8px 8px;
    }

    .file-size {
        display: none;
    }
}
</style>
</head>

<body>

<section id="login-screen">
    <div class="login-card">
        <h1>Облачный Блокнот</h1>
        <p class="muted">Войди через Google, чтобы открыть синхронизируемый редактор.</p>

        <button id="btn-login" class="primary" style="width:100%">
            Войти через Google
        </button>

        <div id="login-error"></div>
    </div>
</section>

<div id="app">
    <header>
        <div class="brand">Облачный Блокнот</div>
        <div class="header-spacer"></div>
        <div id="user-info"></div>
        <button id="btn-logout">Выйти</button>
    </header>

    <div class="toolbar">
        <button id="btn-new">Новый</button>
        <button id="btn-save" class="primary">Сохранить</button>
        <button id="btn-download">Скачать</button>

        <select id="language-select" aria-label="Язык подсветки">
            <option value="plain">Обычный текст</option>
            <option value="javascript">JavaScript</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="json">JSON</option>
        </select>

        <span id="save-status">Подключение...</span>
    </div>

    <div id="app-error"></div>

    <main class="editor-shell">
        <div id="editor"></div>
    </main>

    <section class="files-panel">
        <div class="files-header">
            <strong>Облачные файлы</strong>
            <button id="btn-upload">Загрузить файл</button>
            <input id="file-input" type="file" hidden multiple>
        </div>
        <div id="file-list">
            <div class="empty">Загрузка списка файлов...</div>
        </div>
    </section>
</div>

<script type="module">
import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
    getDatabase,
    ref,
    onValue,
    set,
    update,
    remove,
    push
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

import { basicSetup } from "https://esm.sh/codemirror@6.0.1?bundle";
import { EditorView } from "https://esm.sh/@codemirror/view@6.38.6?bundle";
import { EditorState } from "https://esm.sh/@codemirror/state@6.5.2?bundle";
import {
    defaultHighlightStyle,
    syntaxHighlighting,
    StreamLanguage
} from "https://esm.sh/@codemirror/language@6.11.2?bundle";
import { javascript } from "https://esm.sh/@codemirror/lang-javascript@6.2.4?bundle";
import { html } from "https://esm.sh/@codemirror/lang-html@6.4.11?bundle";
import { css } from "https://esm.sh/@codemirror/lang-css@6.3.1?bundle";
import { json } from "https://esm.sh/@codemirror/lang-json@6.0.2?bundle";

/* Firebase configuration */
const firebaseConfig = {
    apiKey: "AIzaSyC6JayNN_rZcn8o9scI5gBEVKO6xXhQLV4",
    authDomain: "text-transmission-7aa49.firebaseapp.com",
    databaseURL: "https://text-transmission-7aa49-default-rtdb.firebaseio.com",
    projectId: "text-transmission-7aa49",
    storageBucket: "text-transmission-7aa49.firebasestorage.app",
    messagingSenderId: "749005357603",
    appId: "1:749005357603:web:a3d567ce1b91350336a796"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getDatabase(appFirebase);
const provider = new GoogleAuthProvider();

const $ = id => document.getElementById(id);

const loginScreen = $("login-screen");
const loginButton = $("btn-login");
const loginError = $("login-error");
const appScreen = $("app");
const userInfo = $("user-info");
const saveStatus = $("save-status");
const appError = $("app-error");
const fileInput = $("file-input");
const fileList = $("file-list");
const languageSelect = $("language-select");

let currentUser = null;
let editor = null;
let currentDocumentId = "main";
let documentListener = null;
let filesListener = null;
let saveTimer = null;
let applyingRemoteChange = false;
let lastSavedText = "";
let saveRevision = 0;

/* Status messages */
function setStatus(message, type = "") {
    saveStatus.textContent = message;
    saveStatus.className = type;
}

function showAppError(message) {
    appError.style.display = "block";
    appError.textContent = message;
}

function hideAppError() {
    appError.style.display = "none";
    appError.textContent = "";
}

/* Editor language support */
function getLanguageExtension(language) {
    switch (language) {
        case "javascript":
            return javascript();
        case "html":
            return html();
        case "css":
            return css();
        case "json":
            return json();
        default:
            return [];
    }
}

function changeLanguage(language) {
    if (!editor) return;

    const currentText = editor.state.doc.toString();
    const selection = editor.state.selection.main;

    editor.dispatch({
        effects: StateEffect.reconfigure.of([
            basicSetup,
            syntaxHighlighting(defaultHighlightStyle, { fallback: true }),
            EditorView.lineWrapping,
            editorTheme,
            getLanguageExtension(language),
            EditorView.updateListener.of(handleEditorUpdate)
        ])
    });
}

/* CodeMirror theme */
const editorTheme = EditorView.theme({
    "&": {
        height: "100%",
        color: "#e7eaf0",
        backgroundColor: "#0f1219"
    },
    ".cm-content": {
        caretColor: "#a99dff",
        fontFamily: "ui-monospace, SFMono-Regular, Consolas, monospace",
        padding: "12px 0"
    },
    ".cm-cursor, .cm-dropCursor": {
        borderLeftColor: "#a99dff"
    },
    "&.cm-focused .cm-selectionBackground, ::selection": {
        backgroundColor: "#6557bd66"
    },
    ".cm-activeLine": {
        backgroundColor: "#ffffff08"
    },
    ".cm-gutters": {
        backgroundColor: "#11151d",
        color: "#697386",
        border: "none"
    }
});

import { StateEffect } from "https://esm.sh/@codemirror/state@6.5.2?bundle";

/* Save editor changes */
function handleEditorUpdate(updateEvent) {
    if (!updateEvent.docChanged || applyingRemoteChange) return;

    setStatus("Есть изменения...");
    scheduleSave(updateEvent.state.doc.toString());
}

function createEditor(initialText = "") {
    const extensions = [
        basicSetup,
        syntaxHighlighting(defaultHighlightStyle, { fallback: true }),
        EditorView.lineWrapping,
        editorTheme,
        getLanguageExtension(languageSelect.value),
        EditorView.updateListener.of(handleEditorUpdate)
    ];

    const state = EditorState.create({
        doc: initialText,
        extensions
    });

    editor = new EditorView({
        state,
        parent: $("editor")
    });
}

/* Replace editor text without triggering a save loop */
function setEditorText(text) {
    if (!editor) {
        createEditor(text);
        return;
    }

    if (editor.state.doc.toString() === text) return;

    applyingRemoteChange = true;

    editor.dispatch({
        changes: {
            from: 0,
            to: editor.state.doc.length,
            insert: text
        }
    });

    applyingRemoteChange = false;
}

/* Database document path */
function getDocumentRef() {
    return ref(
        db,
        `users/${currentUser.uid}/documents/${currentDocumentId}`
    );
}

function getFilesRef() {
    return ref(db, `users/${currentUser.uid}/files`);
}

/* Save with debounce */
function scheduleSave(text) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => saveDocument(text), 700);
}

async function saveDocument(text = editor?.state.doc.toString() ?? "") {
    if (!currentUser) return;

    const revision = ++saveRevision;
    setStatus("Сохранение...");

    try {
        await set(getDocumentRef(), {
            text,
            updatedAt: Date.now(),
            language: languageSelect.value
        });

        if (revision === saveRevision) {
            lastSavedText = text;
            setStatus("Сохранено", "saved");
        }
    } catch (error) {
        console.error("Save error:", error);
        setStatus("Ошибка сохранения", "error");
        showAppError("Не удалось сохранить документ: " + error.message);
    }
}

/* Subscribe to cloud document */
function subscribeToDocument() {
    if (documentListener) {
        documentListener();
        documentListener = null;
    }

    setStatus("Загрузка...");

    documentListener = onValue(
        getDocumentRef(),
        snapshot => {
            const data = snapshot.val();

            if (!data) {
                setEditorText("");
                lastSavedText = "";
                setStatus("Новый документ");
                return;
            }

            const remoteText = typeof data.text === "string" ? data.text : "";

            if (remoteText !== editor?.state.doc.toString()) {
                setEditorText(remoteText);
            }

            lastSavedText = remoteText;

            if (data.language && data.language !== languageSelect.value) {
                languageSelect.value = data.language;
                applyLanguage(data.language);
            }

            setStatus("Синхронизировано", "saved");
            hideAppError();
        },
        error => {
            console.error("Document listener error:", error);
            setStatus("Ошибка подключения", "error");
            showAppError("Ошибка чтения документа: " + error.message);
        }
    );
}

function applyLanguage(language) {
    if (!editor) return;

    const currentText = editor.state.doc.toString();

    const state = EditorState.create({
        doc: currentText,
        extensions: [
            basicSetup,
            syntaxHighlighting(defaultHighlightStyle, { fallback: true }),
            EditorView.lineWrapping,
            editorTheme,
            getLanguageExtension(language),
            EditorView.updateListener.of(handleEditorUpdate)
        ]
    });

    editor.setState(state);
}

languageSelect.addEventListener("change", async () => {
    applyLanguage(languageSelect.value);

    if (currentUser) {
        try {
            await update(getDocumentRef(), {
                language: languageSelect.value,
                updatedAt: Date.now()
            });
        } catch (error) {
            console.error(error);
            showAppError("Не удалось сохранить язык: " + error.message);
        }
    }
});

/* Create new document */
$("btn-new").addEventListener("click", async () => {
    if (!currentUser) return;

    const confirmed = confirm("Создать новый документ? Текущий документ останется в облаке.");
    if (!confirmed) return;

    currentDocumentId = push(
        ref(db, `users/${currentUser.uid}/documents`)
    ).key;

    languageSelect.value = "plain";
    setEditorText("");
    lastSavedText = "";

    await saveDocument("");
    subscribeToDocument();
});

/* Manual save */
$("btn-save").addEventListener("click", () => {
    clearTimeout(saveTimer);
    saveDocument();
});

/* Download current text */
$("btn-download").addEventListener("click", () => {
    const text = editor?.state.doc.toString() ?? "";
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = "document.txt";
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
});

/* Correct File -> Base64 conversion */
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(
            reader.error || new Error("Не удалось прочитать файл")
        );

        reader.readAsDataURL(file);
    });
}

/* Upload file to Realtime Database */
async function uploadFile(file) {
    if (!currentUser) {
        throw new Error("Сначала войди в аккаунт.");
    }

    const base64 = await fileToBase64(file);
    const fileRef = push(getFilesRef());

    await set(fileRef, {
        name: file.name,
        type: file.type || "application/octet-stream",
        size: file.size,
        data: base64,
        uploadedAt: Date.now()
    });
}

/* File upload controls */
$("btn-upload").addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", async () => {
    const files = Array.from(fileInput.files || []);
    if (!files.length) return;

    $("btn-upload").disabled = true;
    hideAppError();

    try {
        for (const file of files) {
            await uploadFile(file);
        }

        setStatus("Файлы загружены", "saved");
    } catch (error) {
        console.error("Upload error:", error);
        showAppError("Не удалось загрузить файл: " + error.message);
    } finally {
        $("btn-upload").disabled = false;
        fileInput.value = "";
    }
});

/* Render cloud files */
function subscribeToFiles() {
    if (filesListener) {
        filesListener();
        filesListener = null;
    }

    filesListener = onValue(
        getFilesRef(),
        snapshot => {
            fileList.replaceChildren();

            const files = snapshot.val();

            if (!files) {
                const empty = document.createElement("div");
                empty.className = "empty";
                empty.textContent = "Файлов пока нет.";
                fileList.appendChild(empty);
                return;
            }

            for (const [id, file] of Object.entries(files)) {
                const row = document.createElement("div");
                row.className = "file-item";

                const name = document.createElement("div");
                name.className = "file-name";
                name.textContent = file.name || "Без названия";

                const size = document.createElement("div");
                size.className = "file-size";
                size.textContent = formatBytes(file.size || 0);

                const download = document.createElement("button");
                download.textContent = "Скачать";
                download.addEventListener("click", () => {
                    downloadStoredFile(file);
                });

                const removeButton = document.createElement("button");
                removeButton.textContent = "Удалить";
                removeButton.addEventListener("click", async () => {
                    if (!confirm(`Удалить файл «${file.name || "Без названия"}»?`)) {
                        return;
                    }

                    try {
                        await remove(ref(db, `users/${currentUser.uid}/files/${id}`));
                    } catch (error) {
                        console.error(error);
                        showAppError("Не удалось удалить файл: " + error.message);
                    }
                });

                row.append(name, size, download, removeButton);
                fileList.appendChild(row);
            }
        },
        error => {
            console.error("Files listener error:", error);
            showAppError("Не удалось загрузить список файлов: " + error.message);
        }
    );
}

function formatBytes(bytes) {
    if (!Number.isFinite(bytes) || bytes <= 0) return "0 Б";

    const units = ["Б", "КБ", "МБ", "ГБ"];
    const index = Math.min(
        Math.floor(Math.log(bytes) / Math.log(1024)),
        units.length - 1
    );

    return `${(bytes / Math.pow(1024, index)).toFixed(index ? 1 : 0)} ${units[index]}`;
}

/* Download a stored Base64 file */
function downloadStoredFile(file) {
    if (!file.data) {
        showAppError("У файла отсутствуют данные.");
        return;
    }

    try {
        const a = document.createElement("a");
        a.href = file.data;
        a.download = file.name || "download";
        document.body.appendChild(a);
        a.click();
        a.remove();
    } catch (error) {
        console.error(error);
        showAppError("Не удалось скачать файл: " + error.message);
    }
}

/* Sign in */
loginButton.addEventListener("click", async () => {
    loginButton.disabled = true;
    loginError.textContent = "";

    try {
        await signInWithPopup(auth, provider);
    } catch (error) {
        console.error("Login error:", error);

        let message = error.message || "Неизвестная ошибка";

        if (error.code === "auth/popup-blocked") {
            message = "Браузер заблокировал окно входа. Разреши всплывающие окна.";
        } else if (error.code === "auth/unauthorized-domain") {
            message = "Домен сайта не разрешён в Firebase Authentication. Добавь домен в Authorized domains.";
        } else if (error.code === "auth/operation-not-allowed") {
            message = "В Firebase Console не включён способ входа через Google.";
        } else if (error.code === "auth/popup-closed-by-user") {
            message = "Окно входа закрыто до завершения авторизации.";
        }

        loginError.textContent = message;
    } finally {
        loginButton.disabled = false;
    }
});

/* Sign out */
$("btn-logout").addEventListener("click", async () => {
    try {
        await signOut(auth);
    } catch (error) {
        console.error(error);
        showAppError("Не удалось выйти: " + error.message);
    }
});

/* Authentication state */
onAuthStateChanged(auth, async user => {
    currentUser = user;

    if (!user) {
        loginScreen.style.display = "flex";
        appScreen.style.display = "none";
        userInfo.textContent = "";

        if (documentListener) {
            documentListener();
            documentListener = null;
        }

        if (filesListener) {
            filesListener();
            filesListener = null;
        }

        if (editor) {
            editor.destroy();
            editor = null;
        }

        $("editor").replaceChildren();
        return;
    }

    loginScreen.style.display = "none";
    appScreen.style.display = "flex";
    userInfo.textContent = user.email || user.displayName || "Аккаунт";

    hideAppError();

    if (!editor) {
        createEditor("");
    }

    currentDocumentId = "main";

    subscribeToDocument();
    subscribeToFiles();
});
</script>

</body>
</html>
